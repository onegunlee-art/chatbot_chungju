[project]
name = "chungju-chatbot"
version = "0.1.0"
description = "충주시 공식 자료 기반 AI 안내 챗봇"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "kiwipiepy>=0.18",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tenacity>=9.0",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3.3", "torch>=2.4"]
voyage = ["voyageai>=0.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
chungju = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
