<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>충주 AI 안내 — 아바타</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #14181f; --muted: #5d6570;
    --line: #e1e5ea; --brand: #1f6feb; --brand-ink: #fff; --stage: #e8edf2;
    --warn: #9a5b06; --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1319; --panel:#171c24; --ink:#e9ecf0; --muted:#98a2b3;
            --line:#262d38; --brand:#4a90ff; --stage:#1d242e; --warn:#e0a350; --ok:#5cc08a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

  .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh;
          display: flex; flex-direction: column; background: var(--panel); }

  /* ── 아바타 무대 ────────────────────────────── */
  .stage { position: relative; background: var(--stage); padding: 20px 16px 16px;
           border-bottom: 1px solid var(--line); }
  .badge { position: absolute; top: 14px; left: 16px; z-index: 2;
           display: inline-flex; align-items: center; gap: 5px;
           font-size: 11px; font-weight: 700; letter-spacing: .02em;
           background: rgba(20,24,31,.78); color: #fff; padding: 5px 9px; border-radius: 999px; }
  .badge .pulse { width: 6px; height: 6px; border-radius: 50%; background: #6fd39a; }

  .avatar { width: 172px; height: 172px; margin: 0 auto; position: relative; }
  .ring { position: absolute; inset: -10px; border-radius: 50%;
          border: 2px solid var(--brand); opacity: 0; }
  .frame { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
           background: var(--panel); border: 3px solid var(--panel);
           box-shadow: 0 6px 22px rgba(20,24,31,.13); }
  .frame svg { display: block; width: 100%; height: 100%; }

  .slot-note { text-align: center; font-size: 11px; color: var(--muted);
               margin-top: 10px; line-height: 1.5; }
  .slot-note strong { color: var(--warn); }

  /* 상태 표시 */
  .state { display: flex; justify-content: center; align-items: center; gap: 7px;
           height: 24px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .bars { display: none; align-items: flex-end; gap: 3px; height: 16px; }
  .bars i { width: 3px; background: var(--brand); border-radius: 2px; height: 5px;
            animation: bounce .9s ease-in-out infinite; }
  .bars i:nth-child(2){ animation-delay:.12s } .bars i:nth-child(3){ animation-delay:.24s }
  .bars i:nth-child(4){ animation-delay:.36s } .bars i:nth-child(5){ animation-delay:.48s }
  @keyframes bounce { 0%,100%{height:5px} 50%{height:16px} }

  .dots { display: none; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
            animation: fade 1.2s infinite; }
  .dots i:nth-child(2){ animation-delay:.2s } .dots i:nth-child(3){ animation-delay:.4s }
  @keyframes fade { 0%,100%{opacity:.25} 50%{opacity:1} }

  body[data-state="thinking"] .dots { display: flex; }
  body[data-state="speaking"] .bars { display: flex; }
  body[data-state="speaking"] .ring { opacity: .45; animation: halo 1.6s ease-out infinite; }
  @keyframes halo { 0%{transform:scale(1);opacity:.45} 100%{transform:scale(1.13);opacity:0} }

  /* ── 대화 ──────────────────────────────────── */
  main { flex: 1; padding: 16px; padding-bottom: 96px; }
  .msg { margin: 12px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; padding: 11px 14px; border-radius: 14px; line-height: 1.68;
            font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .user .bubble { background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .bot .bubble  { background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

  .cites { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 12px; }
  .cites ol { margin: 0; padding-left: 18px; }
  .cites li { margin: 4px 0; color: var(--muted); }
  .cites a { color: var(--brand); text-decoration: none; }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
         border: 1px solid var(--line); margin-right: 5px; color: var(--muted); }
  .tag.official { border-color: var(--ok); color: var(--ok); }
  .tag.expired { border-color: var(--warn); color: var(--warn); }

  .intro { font-size: 13px; color: var(--muted); background: var(--bg); line-height: 1.7;
           border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips button { background: transparent; border: 1px solid var(--line); color: var(--muted);
                  font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 999px; cursor: pointer; }

  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
           border-top: 1px solid var(--line); padding: 10px 16px; }
  .composer { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; font-size: 15px; padding: 11px 12px;
             border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
             color: var(--ink); min-height: 46px; }
  button.send { padding: 0 18px; border: 0; border-radius: 10px; background: var(--brand);
                color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
  button.send:disabled { opacity: .45; cursor: default; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body data-state="idle">
<div class="wrap">

  <section class="stage">
    <span class="badge"><span class="pulse"></span>AI 안내 · 시장 본인이 아닙니다</span>

    <div class="avatar">
      <div class="ring"></div>
      <div class="frame">
        <!-- 동의서 서명 후, 이 자리에 실제 아바타 영상이 들어갑니다. -->
        <svg viewBox="0 0 172 172" role="img" aria-label="아바타가 들어갈 자리">
          <rect width="172" height="172" fill="#dfe6ec"/>
          <path d="M86 42c-14 0-25 11-25 26s11 27 25 27 25-12 25-27-11-26-25-26z" fill="#b9c4ce"/>
          <path d="M28 168c0-30 26-49 58-49s58 19 58 49z" fill="#b9c4ce"/>
          <circle cx="86" cy="96" r="24" fill="#dfe6ec"/>
          <path d="M75 95v-6a11 11 0 0 1 22 0v6" stroke="#7d8b98" stroke-width="4.5" fill="none" stroke-linecap="round"/>
          <rect x="73" y="95" width="26" height="20" rx="4.5" fill="#7d8b98"/>
          <circle cx="86" cy="104" r="3" fill="#dfe6ec"/>
        </svg>
      </div>
    </div>

    <div class="state">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="bars"><i></i><i></i><i></i><i></i><i></i></span>
      <span id="stateText">무엇이든 물어보세요</span>
    </div>

    <p class="slot-note">
      지금은 <strong>자리 표시</strong>입니다. 동의서 서명과 동의 영상 촬영이 끝나면<br>
      이 자리에 시장님 아바타가 들어가고, 답변이 음성으로 나옵니다.
    </p>
  </section>

  <main id="log">
    <div class="intro">
      충주시 <strong>공식 자료</strong>에서 찾아 답합니다. 자료에 없는 내용은 지어내지 않고
      “확인되지 않았습니다”라고 말씀드립니다. 답변마다 근거 링크가 함께 표시됩니다.
      <div class="chips">
        <button data-q="충주시 청년 지원사업 뭐가 있어?">청년 지원사업</button>
        <button data-q="출산 지원금 신청 어떻게 해?">출산 지원금</button>
        <button data-q="이번 주 충주에서 열리는 행사 알려줘">이번 주 행사</button>
        <button data-q="탄금대 가는 방법 알려줘">관광 안내</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <textarea id="input" aria-label="질문 입력"
        placeholder="궁금한 점을 입력하세요 (Enter 전송)"></textarea>
      <button class="send" id="send">전송</button>
    </div>
  </footer>

</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stateText = document.getElementById('stateText');
const sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
const history = [];

const STATE_LABEL = {
  idle: '무엇이든 물어보세요',
  thinking: '충주시 자료를 찾는 중입니다',
  speaking: '안내하고 있습니다',
};

function setState(name) {
  document.body.dataset.state = name;
  stateText.textContent = STATE_LABEL[name] || '';
}

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
  return bubble;
}

function renderCitations(bubble, citations) {
  if (!citations.length) return;
  const box = document.createElement('div');
  box.className = 'cites';
  const ol = document.createElement('ol');
  citations.forEach(c => {
    const li = document.createElement('li');
    const trust = document.createElement('span');
    trust.className = 'tag' + (c.trust === '충주시 공식' ? ' official' : '');
    trust.textContent = c.trust;
    li.appendChild(trust);
    if (c.status === 'expired' || c.status === 'superseded') {
      const s = document.createElement('span');
      s.className = 'tag expired';
      s.textContent = c.status === 'expired' ? '마감' : '정정됨';
      li.appendChild(s);
    }
    const a = document.createElement('a');
    a.href = c.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = c.title;
    li.appendChild(a);
    if (c.published_at) li.append(' · ' + c.published_at);
    ol.appendChild(li);
  });
  box.appendChild(ol);
  bubble.appendChild(box);
}

async function ask(question) {
  addBubble('user', question);
  const bubble = addBubble('bot', '');
  let answer = '';
  let citations = [];
  sendBtn.disabled = true;
  setState('thinking');

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question, session_id: sessionId, history: history.slice(-8) })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        const lines = frame.split('\n');
        const evLine = lines.find(l => l.startsWith('event: '));
        const dataLine = lines.find(l => l.startsWith('data: '));
        if (!evLine || !dataLine) continue;
        const event = evLine.slice(7).trim();
        const data = JSON.parse(dataLine.slice(6));

        if (event === 'citations') {
          citations = data;
        } else if (event === 'delta') {
          if (!answer) setState('speaking');
          answer += data.text;
          bubble.textContent = answer;
          window.scrollTo(0, document.body.scrollHeight);
        } else if (event === 'error') {
          answer += (answer ? '\n' : '') + data.message;
          bubble.textContent = answer;
        } else if (event === 'done') {
          renderCitations(bubble, citations);
        }
      }
    }
    history.push({ role: 'user', content: question });
    history.push({ role: 'assistant', content: answer });
  } catch (e) {
    bubble.textContent = '연결에 문제가 있습니다. 잠시 후 다시 시도해 주세요.';
  } finally {
    setState('idle');
    sendBtn.disabled = false;
    input.focus();
  }
}

function submit() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  ask(q);
}

sendBtn.addEventListener('click', submit);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
document.querySelectorAll('.chips button').forEach(b => {
  b.addEventListener('click', () => ask(b.dataset.q));
});
</script>
</body>
</html>
