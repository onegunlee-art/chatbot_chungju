<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>충주 AI 안내</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #667085;
    --line: #e3e6ea; --brand: #1f6feb; --brand-ink: #ffffff; --warn: #b54708;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151a; --panel:#1a1e25; --ink:#e8eaed; --muted:#98a2b3;
            --line:#2a2f38; --brand:#4a90ff; --warn:#f0a868; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--line);
           position:sticky; top:0; display:flex; align-items:center; gap:10px; }
  header .dot { width:34px; height:34px; border-radius:50%; background:var(--brand);
                color:var(--brand-ink); display:grid; place-items:center; font-weight:700; }
  header h1 { font-size:16px; margin:0; }
  header p  { font-size:12px; margin:2px 0 0; color:var(--muted); }
  main { max-width:760px; margin:0 auto; padding:16px; padding-bottom:120px; }
  .msg { margin:14px 0; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:86%; padding:11px 14px; border-radius:14px; line-height:1.65;
            white-space:pre-wrap; word-break:break-word; }
  .user .bubble { background:var(--brand); color:var(--brand-ink); border-bottom-right-radius:4px; }
  .bot  .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .cites { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; }
  .cites a { color:var(--brand); text-decoration:none; }
  .cites li { margin:4px 0; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:999px;
         border:1px solid var(--line); margin-right:6px; color:var(--muted); }
  .tag.official { border-color:var(--brand); color:var(--brand); }
  .tag.expired  { border-color:var(--warn); color:var(--warn); }
  .notice { font-size:12px; color:var(--muted); background:var(--panel);
            border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0 4px; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel);
           border-top:1px solid var(--line); padding:10px 16px; }
  .composer { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; font:inherit; padding:11px 12px; border-radius:10px;
             border:1px solid var(--line); background:var(--bg); color:var(--ink); min-height:46px; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--brand);
           color:var(--brand-ink); font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .examples button { background:transparent; border:1px solid var(--line); color:var(--muted);
                     font-weight:400; font-size:13px; padding:6px 10px; }
</style>
</head>
<body>
<header>
  <div class="dot">충</div>
  <div>
    <h1>충주 AI 안내</h1>
    <p>충주시 공식 자료를 근거로 답합니다 · 시장 본인이 아닌 AI입니다</p>
  </div>
</header>

<main id="log">
  <div class="notice">
    안녕하세요! 충주시 공식 자료를 찾아 안내해 드리는 AI입니다.
    자료에서 확인되지 않은 내용은 지어내지 않고 “확인되지 않았습니다”라고 말씀드립니다.
    <div class="examples">
      <button data-q="충주시 청년 지원사업 뭐가 있어?">청년 지원사업</button>
      <button data-q="이번 주 충주에서 열리는 행사 알려줘">이번 주 행사</button>
      <button data-q="출산 지원금 신청 어떻게 해?">출산 지원금</button>
      <button data-q="탄금호 가는 방법 알려줘">관광 안내</button>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="궁금한 점을 입력하세요 (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
    <button id="send">전송</button>
  </div>
</footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
const history = [];

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
  return bubble;
}

function renderCitations(bubble, citations) {
  if (!citations.length) return;
  const box = document.createElement('div');
  box.className = 'cites';
  const ol = document.createElement('ol');
  citations.forEach(c => {
    const li = document.createElement('li');
    const trust = document.createElement('span');
    trust.className = 'tag' + (c.trust === '충주시 공식' ? ' official' : '');
    trust.textContent = c.trust;
    li.appendChild(trust);
    if (c.status === 'superseded' || c.status === 'expired') {
      const s = document.createElement('span');
      s.className = 'tag expired';
      s.textContent = c.status === 'expired' ? '마감' : '정정됨';
      li.appendChild(s);
    }
    const a = document.createElement('a');
    a.href = c.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = c.title;
    li.appendChild(a);
    if (c.published_at) li.append(' · ' + c.published_at);
    ol.appendChild(li);
  });
  box.appendChild(ol);
  bubble.appendChild(box);
}

async function ask(question) {
  addBubble('user', question);
  const bubble = addBubble('bot', '');
  let answer = '';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question, session_id: sessionId, history: history.slice(-8) })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();

      for (const frame of frames) {
        const evLine = frame.split('\n').find(l => l.startsWith('event: '));
        const dataLine = frame.split('\n').find(l => l.startsWith('data: '));
        if (!evLine || !dataLine) continue;
        const event = evLine.slice(7).trim();
        const data = JSON.parse(dataLine.slice(6));

        if (event === 'delta') {
          answer += data.text;
          bubble.textContent = answer;
          window.scrollTo(0, document.body.scrollHeight);
        } else if (event === 'citations') {
          bubble.dataset.citations = JSON.stringify(data);
        } else if (event === 'error') {
          answer += '\n' + data.message;
          bubble.textContent = answer;
        } else if (event === 'done') {
          renderCitations(bubble, JSON.parse(bubble.dataset.citations || '[]'));
        }
      }
    }
    history.push({ role: 'user', content: question });
    history.push({ role: 'assistant', content: answer });
  } catch (e) {
    bubble.textContent = '연결에 문제가 있습니다. 잠시 후 다시 시도해 주세요.';
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function submit() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  ask(q);
}

sendBtn.addEventListener('click', submit);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
});
document.querySelectorAll('.examples button').forEach(b => {
  b.addEventListener('click', () => ask(b.dataset.q));
});
</script>
</body>
</html>
