services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chungju
      POSTGRES_PASSWORD: chungju
      POSTGRES_DB: chungju
      TZ: Asia/Seoul
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chungju -d chungju"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chungju:chungju@db:5432/chungju
      TZ: Asia/Seoul
    ports: ["8000:8000"]
    volumes:
      - ./app:/srv/app:ro
      - hfcache:/root/.cache/huggingface

volumes:
  pgdata:
  hfcache:
